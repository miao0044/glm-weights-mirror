name: Verify release completeness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify all expected release assets
        run: python3 scripts/verify_release.py --repo "$GITHUB_REPOSITORY"
