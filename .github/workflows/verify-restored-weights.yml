name: Verify restored weights

on:
  workflow_dispatch:
    inputs:
      model:
        description: Model to restore-verify
        required: true
        type: choice
        options:
          - GLM-5.1
          - GLM-5.1-FP8
          - GLM-5.2
          - GLM-5.2-FP8
      start:
        description: First shard number (1-based, inclusive)
        required: true
        type: string
      end:
        description: Last shard number (1-based, inclusive)
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        env:
          MODEL: ${{ inputs.model }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
        run: |
          matrix=$(python3 scripts/make_lane_matrix.py --model "$MODEL" --start "$START" --end "$END" --lanes 12)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  verify:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Stream all parts and verify reconstructed file hashes
        env:
          MODEL: ${{ matrix.model }}
          START: ${{ matrix.start }}
          END: ${{ matrix.end }}
          LANE: ${{ matrix.lane }}
          LANE_COUNT: ${{ matrix.lane_count }}
        run: |
          python3 scripts/verify_restore_lane.py \
            --model "$MODEL" \
            --start "$START" \
            --end "$END" \
            --lane "$LANE" \
            --lane-count "$LANE_COUNT"
