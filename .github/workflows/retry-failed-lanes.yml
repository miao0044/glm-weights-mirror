name: Retry failed mirror lanes

on:
  workflow_run:
    workflows:
      - Mirror weight shards
    types:
      - completed

permissions:
  actions: write
  contents: read

jobs:
  retry:
    if: >-
      ${{
        (github.event.workflow_run.conclusion == 'failure' ||
         github.event.workflow_run.conclusion == 'timed_out') &&
        github.event.workflow_run.run_attempt < 4
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Retry only failed lanes after a cooldown
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          sleep 300
          gh run rerun "$FAILED_RUN_ID" --failed --repo "$GITHUB_REPOSITORY"
